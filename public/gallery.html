<style>
  :root {
    --ink: #f4efe6;
    --dark: #0d0d0c;
    --accent: #f4efe6;
    --overlay: rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--dark); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Top bar ---------- */
  header {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
  }
  header { transition: background .3s, backdrop-filter .3s; }
  header.solid { background: rgba(13,13,12,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  nav.main { display: flex; gap: 28px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  nav.main a { opacity: .85; transition: opacity .2s; }
  nav.main a:hover, nav.main a.active { opacity: 1; }
  .right { display: flex; align-items: center; gap: 18px; }
  .ig { width: 22px; height: 22px; display: grid; place-items: center; opacity: .9; }
  .ig:hover { opacity: 1; }
  .btn {
    display: inline-block; padding: 10px 22px; border: 1.5px solid var(--ink);
    font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    transition: background .2s, color .2s;
  }
  .btn:hover { background: var(--ink); color: var(--dark); }
  .burger { display: none; background: none; border: 0; color: var(--ink); cursor: pointer; }

  /* ---------- Hero slideshow ---------- */
  .hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
  .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease;
    background: #222 center/cover no-repeat;
  }
  .slide.on { opacity: 1; }
  .slide video, .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide.on img { animation: kb 9s ease-out forwards; }
  @keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.08); } }
  .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 65% 75% at 50% 58%, rgba(0,0,0,.62), rgba(0,0,0,.38) 75%), linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 75%, rgba(0,0,0,.45)); pointer-events: none; }

  .center {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 24px; gap: 22px;
  }
  .logo img { height: min(46vh, 440px); width: auto; max-width: 78vw; display: block; filter: drop-shadow(0 2px 18px rgba(0,0,0,.35)); }
  .brand img { height: 22px; width: auto; display: block; }
  .left { display: flex; align-items: center; gap: 40px; }
  .logo .wordmark { font-family: "Archivo Black", sans-serif; font-size: clamp(64px, 14vw, 180px); line-height: .9; letter-spacing: -.02em; }
  .dates { font-size: clamp(16px, 2.2vw, 22px); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .place { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; opacity: .85; margin-top: -12px; }
  .center .btn { padding: 14px 34px; font-size: 14px; }
  .meaning { max-width: 540px; margin-top: -8px; font-size: 13px; letter-spacing: .06em; opacity: .85; font-style: italic; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 18px rgba(0,0,0,.6); }
  .meaning span { font-style: normal; font-weight: 600; letter-spacing: .18em; }
  .blurb { max-width: 540px; font-size: 15px; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 18px rgba(0,0,0,.6); margin-top: 4px; }

  .dots { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 8px; }
  .dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; background: var(--ink); opacity: .4; cursor: pointer; }
  .dots button.on { opacity: 1; }


  /* ---------- Photo reels ---------- */
  html, body { height: auto; }
  .archive { padding: 72px 0 56px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .archive-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 0 32px 18px; }
  .archive h2 { font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  .archive .more { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  .archive .more:hover { opacity: 1; }
  .reel { overflow: hidden; }
  .track { display: flex; gap: 14px; width: max-content; animation: drift 200s linear infinite; }
  .reel.r2 .track { animation-duration: 240s; }
  .track img { height: clamp(180px, 26vw, 340px); width: auto; display: block; border-radius: 2px; filter: saturate(1.05); }
  .reel:hover .track { animation-play-state: paused; }
  @keyframes drift { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } .reel { overflow-x: auto; } }
  .news { padding: 72px 32px 88px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; border-top: 1px solid rgba(244,239,230,.12); }
  .news h2 { font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  .news p { opacity: .75; font-size: 15px; line-height: 1.6; max-width: 46ch; }
  .news form { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(520px, 100%); margin-top: 8px; }
  .news input[type=email] { width: 100%; font: 15px/1.5 Inter, system-ui, sans-serif; color: var(--ink); background: rgba(244,239,230,.06); border: 1px solid rgba(244,239,230,.25); border-radius: 2px; padding: 14px 16px; letter-spacing: .04em; }
  .news input[type=email]::placeholder { color: rgba(244,239,230,.5); text-transform: uppercase; letter-spacing: .14em; font-size: 13px; }
  .news input[type=email]:focus { outline: none; border-color: var(--ink); background: rgba(244,239,230,.1); }
  .news button { cursor: pointer; background: none; color: var(--ink); font-family: inherit; padding: 14px 32px; }
  .news .hp { position: absolute; left: -9999px; }
  .news .done { font-size: 14px; letter-spacing: .08em; opacity: .9; }
  @media (max-width: 760px) { .news { padding: 56px 16px 64px; } }
  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 32px 36px; border-top: 1px solid rgba(244,239,230,.12); font-size: 13px; letter-spacing: .06em; opacity: .85; }
  .foot-logo { height: 16px; width: auto; }
  @media (max-width: 760px) { .archive { padding: 48px 0 40px; } .archive-head, footer { padding-left: 16px; padding-right: 16px; } .track { gap: 10px; } }

  /* ---------- Mobile ---------- */
  @media (max-width: 760px) {
    header { padding: 16px; }
    .burger { display: block; }
    nav.main {
      position: fixed; inset: 0; background: var(--dark);
      flex-direction: column; align-items: center; justify-content: center; gap: 34px; font-size: 22px;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    nav.main.open { opacity: 1; pointer-events: auto; }
    header.menu-open, header.solid.menu-open { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .burger, .brand, .right { position: relative; z-index: 2; }
    body.menu-open { overflow: hidden; }
    .right .btn { padding: 8px 14px; font-size: 12px; }
    .left { gap: 14px; }
    .brand img { height: 18px; }
    .logo img { height: min(32vh, 300px); }
    .center { gap: 16px; }
    .blurb { font-size: 13.5px; }
    .meaning { font-size: 12px; }
    .place { letter-spacing: .12em; font-size: 11.5px; }
    .dates { letter-spacing: .14em; }
  }
</style>
<style>

  body.sub main { padding-top: 96px; }
  .page-head { padding: 24px 32px 28px; display: flex; flex-direction: column; gap: 10px; }
  .page-head h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .page-head p { max-width: 58ch; opacity: .8; line-height: 1.6; font-size: 15px; }
  @media (max-width: 760px) { body.sub main { padding-top: 80px; } .page-head { padding: 16px 16px 22px; } }

  .flash { position: relative; margin: 0 32px; height: min(62vh, 640px); overflow: hidden; border-radius: 2px; background: #000; }
  .flash img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease; }
  .flash img.on { opacity: 1; }
  .flash .count { position: absolute; right: 14px; bottom: 12px; font-size: 12px; letter-spacing: .14em; opacity: .75; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .wall { padding: 18px 0 64px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .wall .reel { overflow: hidden; }
  .wall .track { display: flex; gap: 12px; width: max-content; animation: drift 160s linear infinite; }
  .wall .reel.rev .track { animation-name: driftrev; }
  .wall .reel:nth-child(2) .track { animation-duration: 190s; }
  .wall .reel:nth-child(3) .track { animation-duration: 175s; }
  .wall .reel:nth-child(4) .track { animation-duration: 210s; }
  .wall img { height: clamp(150px, 20vw, 260px); width: auto; display: block; border-radius: 2px; cursor: zoom-in; transition: filter .2s; }
  .wall img:hover { filter: brightness(1.12); }
  .wall .reel:hover .track { animation-play-state: paused; }
  @keyframes driftrev { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,7,.94); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox button { position: absolute; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 14px; font-size: 28px; line-height: 1; opacity: .8; }
  .lightbox button:hover { opacity: 1; }
  .lb-close { top: 12px; right: 12px; } .lb-prev { left: 8px; top: 50%; transform: translateY(-50%); } .lb-next { right: 8px; top: 50%; transform: translateY(-50%); }
  @media (max-width: 760px) { .flash { margin: 0 16px; height: 52vh; } .wall img { height: 150px; } }
  @media (prefers-reduced-motion: reduce) { .wall .track { animation: none; } .wall .reel { overflow-x: auto; } .flash img { transition: none; } }

</style>

  const list = FLASH.slice().sort(() => Math.random() - 0.5);

  let i = 0;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function show(n) {
    imgs.forEach((im, k) => im.classList.toggle("on", k === n));
