<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup | YOON Fest</title>
<meta name="description" content="YOON Fest 2027. May 7 to 9, Sequoia Forest, Kings Canyon, California.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4efe6;
    --dark: #0d0d0c;
    --accent: #f4efe6;
    --overlay: rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--dark); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }

  /* ---------- Top bar ---------- */
  header {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
  }
  header { transition: background .3s, backdrop-filter .3s; }
  header.solid { background: rgba(13,13,12,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  nav.main { display: flex; gap: 28px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  nav.main a { opacity: .85; transition: opacity .2s; }
  nav.main a:hover, nav.main a.active { opacity: 1; }
  .right { display: flex; align-items: center; gap: 18px; }
  .ig { width: 22px; height: 22px; display: grid; place-items: center; opacity: .9; }
  .ig:hover { opacity: 1; }
  .btn {
    display: inline-block; padding: 10px 22px; border: 1.5px solid var(--ink);
    font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    transition: background .2s, color .2s;
  }
  .btn:hover { background: var(--ink); color: var(--dark); }
  .burger { display: none; background: none; border: 0; color: var(--ink); cursor: pointer; }

  /* ---------- Hero slideshow ---------- */
  .hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
  .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease;
    background: #222 center/cover no-repeat;
  }
  .slide.on { opacity: 1; }
  .slide video, .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide.on img { animation: kb 9s ease-out forwards; }
  @keyframes kb { from { transform: scale(1.0); } to { transform: scale(1.08); } }
  .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 65% 75% at 50% 58%, rgba(0,0,0,.62), rgba(0,0,0,.38) 75%), linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,0) 18%, rgba(0,0,0,0) 75%, rgba(0,0,0,.45)); pointer-events: none; }

  .center {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 24px; gap: 22px;
  }
  .logo img { height: min(46vh, 440px); width: auto; max-width: 78vw; display: block; filter: drop-shadow(0 2px 18px rgba(0,0,0,.35)); }
  .brand img { height: 22px; width: auto; display: block; }
  .left { display: flex; align-items: center; gap: 40px; }
  .logo .wordmark { font-family: "Archivo Black", sans-serif; font-size: clamp(64px, 14vw, 180px); line-height: .9; letter-spacing: -.02em; }
  .dates { font-size: clamp(16px, 2.2vw, 22px); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .place { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; opacity: .85; margin-top: -12px; }
  .center .btn { padding: 14px 34px; font-size: 14px; }
  .blurb { max-width: 540px; font-size: 15px; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 18px rgba(0,0,0,.6); margin-top: 4px; }

  .dots { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 8px; }
  .dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; background: var(--ink); opacity: .4; cursor: pointer; }
  .dots button.on { opacity: 1; }


  /* ---------- Photo reels ---------- */
  html, body { height: auto; }
  .archive { padding: 72px 0 56px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .archive-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 0 32px 18px; }
  .archive h2 { font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  .archive .more { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
  .archive .more:hover { opacity: 1; }
  .reel { overflow: hidden; }
  .track { display: flex; gap: 14px; width: max-content; animation: drift 200s linear infinite; }
  .reel.r2 .track { animation-duration: 240s; }
  .track img { height: clamp(180px, 26vw, 340px); width: auto; display: block; border-radius: 2px; filter: saturate(1.05); }
  .reel:hover .track { animation-play-state: paused; }
  @keyframes drift { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } .reel { overflow-x: auto; } }
  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 32px 36px; border-top: 1px solid rgba(244,239,230,.12); font-size: 13px; letter-spacing: .06em; opacity: .85; }
  .foot-logo { height: 16px; width: auto; }
  @media (max-width: 760px) { .archive { padding: 48px 0 40px; } .archive-head, footer { padding-left: 16px; padding-right: 16px; } .track { gap: 10px; } }

  /* ---------- Mobile ---------- */
  @media (max-width: 760px) {
    header { padding: 16px; }
    .burger { display: block; }
    nav.main {
      position: fixed; inset: 0; background: var(--dark);
      flex-direction: column; align-items: center; justify-content: center; gap: 34px; font-size: 22px;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    nav.main.open { opacity: 1; pointer-events: auto; }
    header.menu-open, header.solid.menu-open { background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .burger, .brand, .right { position: relative; z-index: 2; }
    body.menu-open { overflow: hidden; }
    .right .btn { padding: 8px 14px; font-size: 12px; }
    .left { gap: 14px; }
    .brand img { height: 18px; }
    .logo img { height: min(32vh, 300px); }
    .center { gap: 16px; }
    .blurb { font-size: 13.5px; }
    .place { letter-spacing: .12em; font-size: 11.5px; }
    .dates { letter-spacing: .14em; }
  }
</style>
<style>

  body.sub main { padding-top: 96px; }
  .page-head { padding: 24px 32px 28px; display: flex; flex-direction: column; gap: 10px; }
  .page-head h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .page-head p { max-width: 58ch; opacity: .8; line-height: 1.6; font-size: 15px; }
  @media (max-width: 760px) { body.sub main { padding-top: 80px; } .page-head { padding: 16px 16px 22px; } }

  .lineup { padding: 0 32px 72px; display: flex; flex-direction: column; gap: 22px; }
  .lineup .big { font-size: clamp(30px, 6vw, 72px); font-weight: 600; letter-spacing: .04em; line-height: 1.05; text-transform: uppercase; opacity: .92; }
  .lineup p { opacity: .75; line-height: 1.6; max-width: 52ch; }
  .lineup .row { display: flex; flex-wrap: wrap; gap: 14px; }
  .lineup a.btn { padding: 12px 26px; }
  @media (max-width: 760px) { .lineup { padding: 0 16px 80px; } }


  .past { padding: 0 32px 110px; display: flex; flex-direction: column; gap: 22px; }
  .past h2 { font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; padding-top: 28px; border-top: 1px solid rgba(244,239,230,.12); }
  .posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px; }
  .poster { display: flex; flex-direction: column; gap: 10px; }
  .poster button { padding: 0; border: 0; background: none; cursor: zoom-in; display: block; }
  .poster button { position: relative; width: 100%; aspect-ratio: 4 / 5; background: #111; border-radius: 2px; overflow: hidden; isolation: isolate; }
  /* blurred, color-boosted copy of the poster fills any space a square poster leaves */
  .poster button::before { content: ""; position: absolute; inset: -12%; z-index: -1; background: var(--bg) center / cover no-repeat; filter: blur(28px) saturate(1.6) brightness(.9); }
  .poster button::after { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(0,0,0,.12); }
  .poster img { position: relative; width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; transition: transform .25s, filter .25s; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
  .poster button:hover img { transform: translateY(-3px); filter: brightness(1.08) drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
  .poster figcaption { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .85; font-variant-numeric: tabular-nums; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,7,.94); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-close { position: absolute; top: 12px; right: 12px; background: none; border: 0; color: var(--ink); font-size: 30px; padding: 12px; cursor: pointer; }
  @media (max-width: 760px) { .past { padding: 0 16px 80px; } .posters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } .lineup { padding-bottom: 56px; } }
</style>
</head>
<body class="sub">
<header class="solid">
  <div class="left">
  <button class="burger" aria-label="Menu" onclick="var o=document.querySelector('nav.main').classList.toggle('open');document.querySelector('header').classList.toggle('menu-open',o);document.body.classList.toggle('menu-open',o)">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
  </button>
  <a class="brand" href="index.html" aria-label="YOON home"><img src="assets/yoon-wordmark.png" alt="YOON"></a>
  <nav class="main" onclick="if(event.target.tagName==='A'){this.classList.remove('open');document.querySelector('header').classList.remove('menu-open');document.body.classList.remove('menu-open')}">
    <a href="index.html" >Home</a>
    <a href="lineup.html" class="active">Lineup</a>
    <a href="venue.html">Venue</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
  </nav>
  </div>
  <div class="right">
    <a class="ig" href="https://instagram.com/yoonfest" target="_blank" rel="noopener" aria-label="Instagram">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
    </a>
    <a class="btn tickets" href="https://shotgun.live/en/venues/yoon" target="_blank" rel="noopener">Tickets</a>
  </div>
</header>
<main>
<section class="page-head"><h1>Lineup</h1></section>
<section class="lineup">
  <div class="big">Three nights.<br>Announcing soon.</div>
  <p>The 2027 lineup drops here first. Follow along on Instagram so you catch the announcement.</p>
  <div class="row">
    <a class="btn" href="https://shotgun.live/en/venues/yoon" target="_blank" rel="noopener">Get Tickets</a>
    <a class="btn" href="https://instagram.com/yoonfest" target="_blank" rel="noopener">@yoonfest</a>
  </div>
</section>
<section class="past" aria-label="Past lineups">
  <h2>Past lineups</h2>
  <div class="posters"><figure class="poster"><button type="button" data-full="assets/lineups/2026.jpg" aria-label="Open 2026 lineup" style="--bg:url(assets/lineups/2026.jpg)"><img src="assets/lineups/2026.jpg" alt="YOON 2026 lineup poster" loading="lazy" decoding="async"></button><figcaption>2026</figcaption></figure><figure class="poster"><button type="button" data-full="assets/lineups/2024.jpg" aria-label="Open 2024 lineup" style="--bg:url(assets/lineups/2024.jpg)"><img src="assets/lineups/2024.jpg" alt="YOON 2024 lineup poster" loading="lazy" decoding="async"></button><figcaption>2024</figcaption></figure><figure class="poster"><button type="button" data-full="assets/lineups/2023.jpg" aria-label="Open 2023 lineup" style="--bg:url(assets/lineups/2023.jpg)"><img src="assets/lineups/2023.jpg" alt="YOON 2023 lineup poster" loading="lazy" decoding="async"></button><figcaption>2023</figcaption></figure><figure class="poster"><button type="button" data-full="assets/lineups/2022.jpg" aria-label="Open 2022 lineup" style="--bg:url(assets/lineups/2022.jpg)"><img src="assets/lineups/2022.jpg" alt="YOON 2022 lineup poster" loading="lazy" decoding="async"></button><figcaption>2022</figcaption></figure><figure class="poster"><button type="button" data-full="assets/lineups/2021-fall.jpg" aria-label="Open 2021 Fall lineup" style="--bg:url(assets/lineups/2021-fall.jpg)"><img src="assets/lineups/2021-fall.jpg" alt="YOON 2021 Fall lineup poster" loading="lazy" decoding="async"></button><figcaption>2021 Fall</figcaption></figure><figure class="poster"><button type="button" data-full="assets/lineups/2021-spring.jpg" aria-label="Open 2021 Spring lineup" style="--bg:url(assets/lineups/2021-spring.jpg)"><img src="assets/lineups/2021-spring.jpg" alt="YOON 2021 Spring lineup poster" loading="lazy" decoding="async"></button><figcaption>2021 Spring</figcaption></figure></div>
</section>
<div class="lightbox" id="lb" hidden><button class="lb-close" aria-label="Close">&times;</button><img id="lbimg" alt=""></div>
</main>
<footer>
  <img src="assets/yoon-wordmark.png" alt="YOON" class="foot-logo">
  <span>May 7 to 9, 2027 &middot; Sequoia Forest, Kings Canyon, CA</span>
  <a href="https://instagram.com/yoonfest" target="_blank" rel="noopener">@yoonfest</a>
</footer>
<script>
(function(){ const lb=document.getElementById("lb"); if(!lb) return; const im=document.getElementById("lbimg");
  document.querySelectorAll(".poster button").forEach(b=>b.addEventListener("click",()=>{ im.src=b.dataset.full; lb.hidden=false; }));
  const close=()=>{ lb.hidden=true; im.removeAttribute("src"); };
  lb.addEventListener("click",e=>{ if(e.target===lb||e.target.classList.contains("lb-close")) close(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!lb.hidden) close(); }); })();

</script>
</body>
</html>
